version: '3.8'

services:
  db:
    image: postgres:16
    container_name: incidencias-db
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: incidencias
      POSTGRES_PASSWORD: incidencias
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidencias -d incidencias"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: incidencias-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/incidencias
      SPRING_DATASOURCE_USERNAME: incidencias
      SPRING_DATASOURCE_PASSWORD: incidencias
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
