spring:
  application:
    name: incidencias

  datasource:
    url: jdbc:h2:mem:incidencias;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo define schema.sql, no Hibernate. Así el SQL es la fuente de verdad.
      ddl-auto: none

  sql:
    init:
      mode: always
      encoding: UTF-8

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
